services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xayma
      POSTGRES_USER: xayma
      POSTGRES_PASSWORD: xayma-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xayma -d xayma"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  dev-db:
